name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - run: corepack enable
      - run: npm install -g version-patch
      - run: pnpm install --frozen-lockfile

      - name: Set the version
        run: >
          version-patch node "${{ github.event.release.tag_name }}"
          --prefix v
          --git-commit
          --git-msg "chore(release): v{VERSION}"
          --git-name "github-actions[bot]"
          --git-email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: pnpm build
      - run: npm publish --provenance
      - run: git pull --rebase && git push

  update-schema:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JSON schema
        run: pnpm exec tsx ./src/json-schema.ts

      - name: Force checkout schema branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git fetch origin
          git checkout -B schema origin/main

      - name: Commit and push schema
        run: |
          git add -f schema.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: build JSON schema from main"
            git push -f origin schema
          else
            echo "No changes to commit"
          fi
